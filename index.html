<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Trivia — Breakout Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>📖 Bible Trivia</h1>
    <button id="tvToggle" class="button button-dark" type="button" aria-pressed="false">
      TV Mode
    </button>
  </header>

  <main class="game-layout">
    <section class="wheel-panel panel" aria-label="Game wheel">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="900" height="900" aria-label="Category wheel"></canvas>
      </div>
      <button id="spinButton" class="button button-primary" type="button">Spin the Wheel!</button>
      <p id="status" class="status" aria-live="polite">Spin to get a question.</p>
    </section>

    <section class="play-panel panel">
      <div class="game-info">
        <div id="categoryBadge" class="category-badge">Ready to play</div>
        <div id="timer" class="timer" aria-label="26 seconds remaining">26</div>
      </div>

      <div id="countdown" class="countdown" aria-live="assertive" hidden></div>

      <div class="question-card">
        <p id="questionType" class="question-type">Bible Trivia</p>
        <h2 id="question">Spin the wheel to begin!</h2>
        <p id="questionReference" class="reference" hidden></p>
        <p id="questionSource" class="source" hidden></p>
      </div>

      <div class="answer-area">
        <p id="answer" class="answer" hidden></p>
        <div class="game-buttons">
          <button id="revealButton" class="button button-secondary" type="button" disabled>
            Reveal Answer
          </button>
          <button id="nextButton" class="button button-primary" type="button" disabled>
            Next Question
          </button>
        </div>
      </div>

      <section class="scoreboard" aria-label="Team scoreboard">
        <h2>🏆 Teams</h2>
        <div id="teams" class="teams"></div>
      </section>
    </section>
  </main>

  <footer>
    <span>Breakout Games</span>
    <span>Question references: BibleGateway · BibleProject</span>
  </footer>

  <script src="js/game.js" defer></script>
</body>
</html>
